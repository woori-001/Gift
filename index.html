<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사은품 차감 검수</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2256%22%20height%3D%2256%22%20rx%3D%2216%22%20fill%3D%22%234c82f7%22/%3E%3Cpolyline%20points%3D%2219%2033%2028%2042%2045%2023%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app" hidden>
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<div id="login" hidden>
  <form class="lcard" id="loginForm" autocomplete="on">
    <div class="lbrand"><img src="img/wavenet.png" alt="WAVENET"></div>
    <h2>사은품 차감 검수</h2>
    <p class="sub">계정으로 로그인해 주세요.</p>
    <label>아이디<input type="text" id="loginId" autocomplete="username" required></label>
    <label>비밀번호<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <p class="loginerr" id="loginErr"></p>
    <button class="primary lbtn" id="loginBtn" type="submit">로그인</button>
  </form>
</div>

<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="busy" hidden><div><span class="spin"></span><span id="busyMsg">처리 중...</span></div></div>
<input type="file" id="fRaw" accept=".xls,.xlsx,.csv,.htm,.html" hidden>
<input type="file" id="fSt" accept=".xls,.xlsx,.csv,.htm,.html" multiple hidden>

<!-- 엑셀 읽기 라이브러리 (SheetJS). 첫 주소가 막히면 두 번째 주소로 받아요. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.XLSX || document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');</script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
